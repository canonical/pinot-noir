[tox]
envlist =
    lint
recreate = true

[testenv]
package = skip

[vars]
project_path = {tox_root}/pinot_noir
merges_schedule_path = {tox_root}/merges_schedule
reviews_path = {tox_root}/reviews
launchpad_path = {tox_root}/launchpad
data_manager_path = {tox_root}/data_manager
all_path = {[vars]project_path} {[vars]merges_schedule_path} {[vars]reviews_path} {[vars]launchpad_path} {[vars]data_manager_path}

[testenv:format]
description = Apply coding style standards to code
dependency_groups = format
commands =
    ruff check --fix {[vars]all_path}
    ruff format {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
dependency_groups =
    lint
    format
commands =
    codespell {[vars]all_path}
    ruff check {[vars]all_path}
    ruff format --check {[vars]all_path}
    ty check {[vars]all_path}