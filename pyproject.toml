[project]
name = "pinot-noir"
version = "0.1.0"
description = "Django web application using UBQ, providing reports on the status of Ubuntu packages in terms of merges, bug fixes, etc. organized in a team-focused way."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
]

[dependency-groups]
format = [
    "black>=26.3.1",
    "isort>=8.0.1",
]
lint = [
    "codespell>=2.4.2",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pyproject-flake8>=7.0.0",
]


[tool.black]
line-length = 99

[tool.flake8]
max-line-length = 99
max-doc-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pylint]
max-line-length = 99
